[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# UP017 (datetime.UTC), UP042 (StrEnum) require Python 3.11; we still want the
# package to import cleanly on 3.10 for local dev, so keep `timezone.utc` and
# `class X(str, Enum)`.
ignore = ["E501", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

pair_inverter:
  name: Pair inverter
  description: >-
    Run the APsystems Zigbee pairing handshake for a new inverter, identified by
    its 12-digit serial number printed on the device. Persists the result in
    the integration config entry so the inverter is polled on the next cycle.
  fields:
    serial:
      name: Serial number
      description: The 12 decimal digits printed on the inverter label.
      required: true
      example: "408000158211"
      selector:
        text: {}
    name:
      name: Friendly name
      description: Optional label displayed in Home Assistant (defaults to "APS DS3 <last 4 digits>").
      required: false
      example: Toit-est
      selector:
        text: {}

repoll:
  name: Re-poll inverters
  description: >-
    Force an immediate refresh cycle on all paired inverters, bypassing the
    configured polling interval.

reboot_inverter:
  name: Reboot inverter
  description: >-
    Send the proprietary reboot command to a paired inverter. The inverter will
    drop off the grid for a few seconds.
  fields:
    serial:
      name: Serial number
      description: Inverter to reboot, by its 12-digit serial number.
      required: true
      example: "408000158211"
      selector:
        text: {}

discover:
  name: Discover mesh
  description: >-
    Dump the dongle's Zigbee neighbour and routing tables to the Home
    Assistant log (debug level). Useful to check which inverter short
    addresses are actually reachable on the mesh.

rebind_persistent:
  name: Persistent re-bind
  description: >-
    Repeatedly re-run the pair handshake for one inverter until it answers,
    the duration expires, or the campaign is cancelled. A marginal radio
    link fluctuates with PV output and weather, so insisting can catch a
    window where a one-shot re-bind fails. Best started around solar noon.
    Polling of the other inverters keeps running between attempts.
  fields:
    serial:
      name: Serial number
      description: Inverter to re-bind, by its 12-digit serial number.
      required: true
      example: "408000158211"
      selector:
        text: {}
    duration:
      name: Max duration (minutes)
      description: Give up after this many minutes (default 30, max 240).
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    pause:
      name: Pause between attempts (seconds)
      description: Wait this long between handshake cycles (default 60).
      required: false
      default: 60
      selector:
        number:
          min: 20
          max: 600
          unit_of_measurement: s

cancel_rebind:
  name: Cancel persistent re-bind
  description: Stop the running persistent re-bind campaign, if any.

; ESP32-C3 standalone CC2530 flasher (Kadsol CC2591 firmware embedded)
;
; Default environment targets ESP32-C3 DevKit / Super Mini variants.
; If you have a different ESP32 model (classic WROOM, S2, S3), copy the
; `[env:esp32-c3]` section, rename, and change `board` accordingly.
;
; Pinout / LED options are set with build_flags so you don't have to edit
; the source. Override them per-environment if needed.

[platformio]
default_envs = esp32-c3
description = Standalone CC2530+CC2591 flasher with embedded Kadsol firmware

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    ; Pinout on the ESP32 side — see README for non-C3 alternatives.
    -DCC2530_PIN_DD=3
    -DCC2530_PIN_DC=4
    -DCC2530_PIN_RST=5
    ; Onboard LED. On the DevKitM-1 / C3 Mini (Espressif reference) the
    ; onboard LED is an addressable WS2812 on GPIO 8 → CC2530_LED_WS2812=1
    ; drives it via Adafruit NeoPixel (green=success, red=fail-blink).
    ; On the SuperMini it's a plain blue LED on GPIO 8 active-LOW: set
    ; CC2530_LED_WS2812=0 + CC2530_LED_ACTIVE_LOW=1 in that case.
    -DCC2530_PIN_LED=8
    -DCC2530_LED_WS2812=1
    -DCC2530_LED_ACTIVE_LOW=0
    ; Serial routing:
    ;  - Boards with USB-Serial-JTAG natif (DevKitM-1 officiel, /dev/ttyACM*)
    ;    → set both flags to 1 so `Serial` goes to the integrated USB-CDC.
    ;  - Boards with an external CH340 on UART0 (clone "C3 Mini", /dev/ttyUSB*)
    ;    → keep both at 0 so `Serial` goes to the hardware UART pins
    ;      (GPIO 21=TX, GPIO 20=RX) wired to the CH340.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; Example: same firmware, classic ESP32 (WROOM-32, DevKit V1, NodeMCU-32S)
[env:esp32-classic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCC2530_PIN_DD=5
    -DCC2530_PIN_DC=18
    -DCC2530_PIN_RST=19
    -DCC2530_PIN_LED=2
    -DCC2530_LED_ACTIVE_LOW=0
